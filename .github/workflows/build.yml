name: Test and package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# CI runs only for release tags and manual dispatch, not for pull requests or merges to main.
# A newer manual run supersedes an older one on the same ref; tag runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release-guard.py --tag "$GITHUB_REF_NAME" --ref "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev xvfb
      - name: Record environment
        run: |
          echo "revision: $GITHUB_SHA"
          echo "runner: $RUNNER_OS $RUNNER_ARCH ($ImageOS $ImageVersion)"
          rustc --version --verbose
          cargo --version
          python3 --version
          git --version
      # Caches hold dependency inputs only. Release outputs (target/release) and dist/ are never
      # cached, so every shipped binary is built from the candidate commit in this run.
      - name: Restore Cargo dependency and debug build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: cargo-debug-${{ runner.os }}-${{ runner.arch }}-rust1.90.0-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.3
      - name: Python tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Restore coverage tool and coverage build cache
        id: coverage-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            target/llvm-cov-target
          key: cargo-cov-${{ runner.os }}-${{ runner.arch }}-rust1.90.0-llvm-cov-0.6.21-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
      - name: Install coverage tool
        if: steps.coverage-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version 0.6.21
      - name: Measure core and CLI coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov -p fastdiff-core --fail-under-lines 80 --lcov --output-path coverage/core.info
          cargo llvm-cov -p fastdiff-cli --ignore-filename-regex 'crates/fastdiff-core/' --fail-under-lines 80 --lcov --output-path coverage/cli.info
      - name: Build release
        run: cargo build --release --locked --workspace
      - name: Native window smoke test
        run: |
          smoke="$RUNNER_TEMP/fastdiff-smoke"
          rm -rf "$smoke"
          mkdir -p "$smoke/repo"
          fixture="$smoke/repo"
          git -C "$fixture" init
          printf 'first line\n' > "$fixture/smoke.rs"
          request=$(python3 -c 'import json,sys; print(json.dumps({"target":"repository","repository":sys.argv[1],"file":[115,109,111,107,101,46,114,115],"view":"all","wsl":None}))' "$fixture")
          status=0
          timeout 30s env FASTDIFF_BENCH_EXIT_MS=10000 FASTDIFF_BENCH_REPORT="$smoke/report.json" xvfb-run -a ./target/release/fastdiff-gui --request "$request" --smoke-test >"$smoke/stdout.log" 2>"$smoke/stderr.log" || status=$?
          echo "smoke exit code: $status"
          for log in stdout.log stderr.log report.json; do
            if [ -f "$smoke/$log" ]; then echo "--- $log ---"; cat "$smoke/$log"; fi
          done
          [ "$status" -eq 0 ] || exit "$status"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["first_diff_ms"] is not None' "$smoke/report.json"
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-diagnostics
          path: ${{ runner.temp }}/fastdiff-smoke
          if-no-files-found: ignore
      - name: Package Linux
        run: bash scripts/package-unix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wsl-helper
          path: target/release/fastdiff
          if-no-files-found: error

  release-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows-package]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-with-wsl-helper
          path: dist
      - name: Prepare release checksums
        run: python3 scripts/package-release.py --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/fastdiff-*-linux-x64.tar.gz
            dist/fastdiff-*-macos-arm64.tar.gz
            dist/fastdiff-*-windows-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-assets
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Create or resume the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-guard.py --tag "$GITHUB_REF_NAME" --ref "$GITHUB_SHA" --notes-file release-notes.md
          python3 scripts/release-draft.py --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --assets dist --notes-file release-notes.md

  macos:
    # Independent of linux (no shared artifacts), so it starts immediately. release-assets still needs it.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked --no-fail-fast
      - name: Install Python test dependencies
        if: always()
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.3
      - name: Script tests
        if: always()
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build release
        run: cargo build --release --locked --workspace
      - name: Native macOS window smoke test
        shell: python3 {0}
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          gui = Path('target/release/fastdiff-gui').resolve()
          with tempfile.TemporaryDirectory(prefix='fastdiff-smoke-') as directory:
              fixture = Path(directory)
              subprocess.run(['git', '-C', directory, 'init'], check=True)
              (fixture / 'smoke.rs').write_text('first line\n', encoding='utf-8')
              report = fixture / 'report.json'
              request = json.dumps({
                  'target': 'repository',
                  'repository': directory,
                  'file': list(b'smoke.rs'),
                  'view': 'all',
                  'wsl': None,
              })
              subprocess.run(
                  [str(gui), '--request', request, '--smoke-test'],
                  env={
                      **os.environ,
                      'FASTDIFF_BENCH_EXIT_MS': '10000',
                      'FASTDIFF_BENCH_REPORT': str(report),
                      'FASTDIFF_RUNTIME_DIR': str(fixture / 'runtime'),
                  },
                  check=True,
                  timeout=30,
              )
              result = json.loads(report.read_text(encoding='utf-8'))
              assert result.get('first_diff_ms') is not None, 'Native GUI did not render a diff'
      - name: Package macOS
        run: bash scripts/package-unix.sh
      - name: Verify macOS archive layout
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('release_draft', 'scripts/release-draft.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          archive = next(Path('dist').glob('fastdiff-*-macos-arm64.tar.gz'))
          module.verify_tar_archive(archive, archive.name.removesuffix('.tar.gz'), 'macOS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: Record environment
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          "revision: $env:GITHUB_SHA"
          "runner: $env:RUNNER_OS $env:RUNNER_ARCH ($env:ImageOS $env:ImageVersion)"
          rustc --version --verbose
          cargo --version
          python --version
          git --version
      - name: Restore Cargo dependency and debug build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: cargo-debug-${{ runner.os }}-${{ runner.arch }}-rust1.90.0-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
      - name: Check formatting
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all -- --check
      - name: Clippy
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --workspace --locked -- --test-threads=2
      - name: Install Python test dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check pyyaml==6.0.3
      - name: Python tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Windows packaging validation
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/test-package-windows.ps1
      - name: Build release
        run: cargo build --release --locked --workspace
      - name: Install software OpenGL for Windows smoke test
        uses: f3d-app/install-mesa-windows-action@1824e370ed7fb1795f5bc88fd1f6c81eb15d92bc
        with:
          path: '${{ github.workspace }}/target/release'
          version: '23.3.5'
      - name: Native Windows window smoke test
        shell: python {0}
        run: |
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          gui = Path('target/release/fastdiff-gui.exe').resolve()
          smoke = Path(os.environ['RUNNER_TEMP']) / 'fastdiff-smoke'
          shutil.rmtree(smoke, ignore_errors=True)
          fixture = smoke / 'repo'
          fixture.mkdir(parents=True)
          subprocess.run(['git', '-C', str(fixture), 'init'], check=True)
          (fixture / 'smoke.rs').write_text('first line\n', encoding='utf-8')
          report = smoke / 'report.json'
          request = json.dumps({
              'target': 'repository',
              'repository': str(fixture),
              'file': list(b'smoke.rs'),
              'view': 'all',
              'wsl': None,
          })
          failure = None
          try:
              completed = subprocess.run(
                  [str(gui), '--request', request, '--smoke-test'],
                  env={
                      **os.environ,
                      'FASTDIFF_BENCH_EXIT_MS': '10000',
                      'FASTDIFF_BENCH_REPORT': str(report),
                      'FASTDIFF_RUNTIME_DIR': str(smoke / 'runtime'),
                  },
                  capture_output=True,
                  timeout=30,
              )
              stdout, stderr = completed.stdout, completed.stderr
              if completed.returncode != 0:
                  failure = f'smoke test exited with code {completed.returncode}'
          except subprocess.TimeoutExpired as error:
              stdout, stderr = error.stdout or b'', error.stderr or b''
              failure = 'smoke test timed out after 30s'
          (smoke / 'stdout.log').write_bytes(stdout)
          (smoke / 'stderr.log').write_bytes(stderr)
          sys.stdout.reconfigure(encoding='utf-8', errors='replace')
          for name in ('stdout.log', 'stderr.log', 'report.json'):
              path = smoke / name
              if path.exists():
                  print(f'--- {name} ---')
                  print(path.read_text(encoding='utf-8', errors='replace'))
          if failure is None:
              result = json.loads(report.read_text(encoding='utf-8'))
              if result.get('first_diff_ms') is None:
                  failure = 'Native GUI did not render a diff'
          if failure is not None:
              raise SystemExit(failure)
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-diagnostics
          path: ${{ runner.temp }}/fastdiff-smoke
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-binaries
          path: |
            target/release/fastdiff.exe
            target/release/fastdiff-gui.exe
          if-no-files-found: error

  # Only packaging waits for the Linux helper; verification above runs concurrently with Linux.
  # Both inputs are artifacts of this run, so the archive pairs binaries and helper from one candidate.
  windows-package:
    needs: [linux, windows]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-binaries
          path: target/release
      - uses: actions/download-artifact@v4
        with:
          name: wsl-helper
          path: paired-helper
      - name: Package Windows with matching WSL helper
        shell: pwsh
        run: ./scripts/package-windows.ps1 -WslHelper paired-helper/fastdiff
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-with-wsl-helper
          path: dist/*.zip
          if-no-files-found: error

  # Always reports one status that fails on any failed, cancelled, or unexpectedly skipped job.
  # Add every new job to `needs`; tests/test_release_workflow.py enforces it.
  result:
    if: always()
    needs: [linux, macos, windows, windows-package, release-assets, draft-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fold job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          TAG_RUN: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: python3 scripts/ci-result.py --tag-run "$TAG_RUN"
