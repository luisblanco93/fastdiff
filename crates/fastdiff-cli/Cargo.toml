[package]
name = "fastdiff-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "fastdiff"
path = "src/main.rs"

[dependencies]
fastdiff-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
fs2 = "=0.4.3"
interprocess = "=2.4.4"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO"] }
widestring = "=1.2.1"
